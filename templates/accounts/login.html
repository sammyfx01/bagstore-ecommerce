{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Login to continue shopping.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-gold btn-full">Login</button>
    </form>
    <p class="auth-switch">New here? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
