{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Join Jubilee Fashion Home for a personalized shopping experience.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-gold btn-full">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
